[defaults]
# Points at the placeholder-only work-nonprod inventory by default, so a bare
# `ansible-playbook playbooks/onboard.yml` from this directory can never
# accidentally run against some other, unintended inventory -- until you copy
# group_vars/all.example.yml to all.yml and fill in real values, external_clusters
# is empty and every playbook fails fast at its first task.
inventory = inventories/work-nonprod/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
nocows = 1

[ssh_connection]
pipelining = true
