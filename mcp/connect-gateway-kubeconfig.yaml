# Kubeconfig for reaching the on-prem/non-GKE cluster (Phase 1: local `kind`
# cluster `sre-lab`, standing in for on-prem) via GKE Fleet Connect Gateway.
#
# Contains NO credentials. The `exec` block invokes gke-gcloud-auth-plugin at
# request time, which mints a short-lived (~1hr) OAuth token from whatever
# Application Default Credentials are ambient in the runtime — on Cloud Run,
# that's the service's attached runtime SA (sre-k8s-mcp-runtime@...), resolved
# via the metadata server. Nothing long-lived is stored here or anywhere else.
#
# The server/cluster/user names are deterministic (project number + location +
# membership name), so this file does not need to be regenerated per-deploy —
# only if the fleet membership is ever deleted and re-registered under a
# different membership name. See docs/connect-gateway-onprem.md for how this
# was originally proven, and PHASE1_EXECUTION_STATE.md for the current
# membership status.
apiVersion: v1
kind: Config
current-context: connectgateway_sreagent-t2-demo_global_sre-lab
clusters:
  - name: connectgateway_sreagent-t2-demo_global_sre-lab
    cluster:
      server: https://connectgateway.googleapis.com/v1/projects/327234009108/locations/global/memberships/sre-lab
users:
  - name: connectgateway_sreagent-t2-demo_global_sre-lab
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: gke-gcloud-auth-plugin
        provideClusterInfo: true
        installHint: >-
          Install gke-gcloud-auth-plugin for use with kubectl by following
          https://cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl#install_plugin
contexts:
  - name: connectgateway_sreagent-t2-demo_global_sre-lab
    context:
      cluster: connectgateway_sreagent-t2-demo_global_sre-lab
      user: connectgateway_sreagent-t2-demo_global_sre-lab
