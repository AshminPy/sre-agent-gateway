---
# Portable defaults only -- no personal project IDs, cluster names, or paths here.
# Per-cluster values (kube_context, fleet_project_id, fleet_membership, runtime_identity)
# come from inventory (ansible/inventories/<env>/), never from this role.

# Kubernetes RBAC granted at cluster scope, via `gcloud ... generate-gateway-rbac`.
rbac_role: "clusterrole/view"

# The `view` ClusterRole excludes cluster-scoped `nodes` -- confirmed live against
# sre-lab (docs/connect-gateway-onprem.md): `kubectl get nodes` returns Forbidden under
# `view` alone, but mcp/tools/nodes.py calls list_node/read_node as part of normal
# investigation. This grants only the two verbs those calls actually use (list, get) --
# no `watch`, confirmed absent from every mcp/tools/*.py call via repo-wide grep.
grant_node_read: true
node_read_verbs:
  - get
  - list

# Cost safety gate -- CORRECTED 2026-09-22 after independently verifying current
# Google documentation. The original design treated Fleet Membership `clusterTier ==
# ENTERPRISE` as proof of billing and auto-unregistered on it. That was the wrong
# signal: GKE no longer has separate Standard/Enterprise commercial editions (a
# current Google doc states GKE is now a single offering with no tiers), so
# `clusterTier` is legacy metadata the API can still return -- its value alone does
# not prove a cluster is or isn't billed. The actual documented cost driver is
# registering a THIRD-PARTY/non-GKE cluster into a Fleet at all: current GKE pricing
# lists GKE Multicloud Attached Clusters at a per-vCPU/hour charge, and a current
# Google doc states third-party clusters registered to a Fleet "will incur a
# per-vCPU charge as part of your GKE pricing" -- independent of what clusterTier
# later reports. Every cluster this role manages is non-GKE by definition (this is
# the on-prem/third-party onboarding role), so the gate below applies to all of them.
#
# This variable therefore represents EXPLICIT ACCEPTANCE of that documented,
# potentially-billable registration -- not a tier check. Default false: registering
# a new cluster fails loudly, before any Fleet mutation, until a human sets this
# true for that specific cluster (or, once a team has explicitly approved it, for
# a whole inventory/group -- see ansible/PORTING.md). `clusterTier` is still
# recorded as informational evidence (report.yml's `observed_tier`) -- it is no
# longer the safety decision.
allow_billable_external_cluster: false

# Ownership signal for objects this workflow creates. A LABEL, not an annotation --
# `kubectl -l` selectors only match labels, and cleanup.yml selects by this.
onboarded_by_label_key: "sre-agent-gateway.internal/onboarded-by"
onboarded_by_label_value: "ansible-onprem-onboarding"

# No service-account-key path exists in this role. This var intentionally has no
# default and is never read by any task -- present only so `assert` checks in
# preflight.yml can confirm a cluster definition never tries to set it.
# service_account_key_file: (never define this)

gcloud_bin: "gcloud"
kubeconfig_path: "{{ ansible_env.HOME }}/.kube/config"
