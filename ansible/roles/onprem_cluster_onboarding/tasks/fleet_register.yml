---
# Idempotent Fleet Membership registration. Keyless only: --enable-workload-identity
# plus --has-private-issuer (verified current, 2026-09-21, against
# docs.cloud.google.com/sdk/gcloud/reference/container/fleet/memberships/register).
# --service-account-key-file is never constructed anywhere in this file.

- name: "{{ cluster.name }}: compute effective Fleet membership name"
  ansible.builtin.set_fact:
    _membership: "{{ cluster.fleet_membership | default(cluster.name) }}"

- name: "{{ cluster.name }}: check for an existing Fleet membership (state check, not a mutation)"
  ansible.builtin.command:
    argv:
      - "{{ gcloud_bin }}"
      - container
      - fleet
      - memberships
      - describe
      - "{{ _membership }}"
      - --project={{ cluster.fleet_project_id }}
      - --format=json
  register: _existing_membership
  changed_when: false
  failed_when: false

- name: "{{ cluster.name }}: parse existing membership state, if any"
  ansible.builtin.set_fact:
    _membership_before: "{{ (_existing_membership.stdout | from_json) if _existing_membership.rc == 0 else {} }}"
    _would_register: >-
      {{ (_existing_membership.stdout | from_json).state.code | default('') != 'READY'
         if _existing_membership.rc == 0 else true }}

# Cost safety gate -- CORRECTED 2026-09-22 (see defaults/main.yml for the full
# rationale and current-doc citations). This fires BEFORE any Fleet mutation, only
# when registration would actually happen (an already-`READY` cluster from a prior
# approved run is never re-blocked by this on a later idempotent re-run/verify).
- name: "{{ cluster.name }}: require explicit cost approval before registering a new billable external cluster"
  ansible.builtin.fail:
    msg: >-
      Registering '{{ cluster.name }}' would create a NEW Fleet membership for a
      third-party/non-GKE cluster. Google currently documents third-party/attached
      clusters registered to a Fleet as incurring a per-vCPU charge (GKE Multicloud
      Attached Clusters pricing) -- this applies regardless of what Fleet tier the
      resulting membership later reports. Explicit approval is required before this
      workflow will register one. Set `allow_billable_external_cluster: true` for
      this cluster in inventory (or once for a whole approved inventory/group -- see
      ansible/PORTING.md) only after you/your team have explicitly accepted this
      cost -- never set it globally by default.
  when:
    - _would_register
    - not (cluster.allow_billable_external_cluster | default(allow_billable_external_cluster) | bool)

- name: "{{ cluster.name }}: register into the Fleet (only if absent or not READY)"
  ansible.builtin.command:
    argv:
      - "{{ gcloud_bin }}"
      - container
      - fleet
      - memberships
      - register
      - "{{ _membership }}"
      - --project={{ cluster.fleet_project_id }}
      - --context={{ cluster.kube_context }}
      - --kubeconfig={{ kubeconfig_path }}
      - --enable-workload-identity
      - --has-private-issuer
      - --quiet
  register: _register_result
  when: _would_register
  changed_when: true
  # No failed_when override here: a real registration failure (name collision,
  # Fleet API unavailable, etc.) MUST propagate to the caller's block/rescue --
  # this is the mutating step, not a state check.

- name: "{{ cluster.name }}: re-describe membership to read its assigned tier"
  ansible.builtin.command:
    argv:
      - "{{ gcloud_bin }}"
      - container
      - fleet
      - memberships
      - describe
      - "{{ _membership }}"
      - --project={{ cluster.fleet_project_id }}
      - --format=json
  register: _membership_after_raw
  changed_when: false

- name: "{{ cluster.name }}: parse post-registration membership state"
  ansible.builtin.set_fact:
    _membership_after: "{{ _membership_after_raw.stdout | from_json }}"
    _observed_tier: "{{ (_membership_after_raw.stdout | from_json).clusterTier | default('CLUSTER_TIER_UNSPECIFIED') }}"

- name: "{{ cluster.name }}: fail loudly if membership state is not READY"
  ansible.builtin.fail:
    msg: >-
      Fleet registration for '{{ cluster.name }}' (membership '{{ _membership }}')
      did not reach READY. Observed state:
      {{ _membership_after.state | default('unknown') }}.
  when: _membership_after.state.code | default('') != 'READY'

# Fleet tier -- INFORMATIONAL ONLY (CORRECTED 2026-09-22, see defaults/main.yml).
# `clusterTier` is legacy, output-only metadata (no register-time flag sets it, and
# GKE no longer has separate commercial editions per current docs) -- it is recorded
# as evidence (report.yml's `observed_tier`) but is NOT the cost-control decision.
# The actual cost gate is the explicit `allow_billable_external_cluster` approval
# above, which already ran before this cluster was ever registered. A cluster is
# never unregistered here just because `clusterTier` happens to say `ENTERPRISE`.
- name: "{{ cluster.name }}: record observed Fleet tier (informational)"
  ansible.builtin.debug:
    msg: >-
      Membership '{{ _membership }}' reports clusterTier='{{ _observed_tier }}'.
      This is recorded as evidence only -- registration was already explicitly
      approved via allow_billable_external_cluster, so no action is taken based on
      this value alone.

# Label the membership as workflow-owned, iff this run actually performed the
# register step (correction #3: cleanup must not later touch a membership we
# didn't create just because its name matches inventory).
- name: "{{ cluster.name }}: label the Fleet membership as created by this workflow"
  ansible.builtin.command:
    argv:
      - "{{ gcloud_bin }}"
      - container
      - fleet
      - memberships
      - update
      - "{{ _membership }}"
      - --project={{ cluster.fleet_project_id }}
      - --update-labels={{ onboarded_by_label_key | regex_replace('[^a-z0-9-]', '-') }}={{ onboarded_by_label_value }}
      - --quiet
  when: _register_result is not skipped
  changed_when: true

- name: "{{ cluster.name }}: fleet registration OK"
  ansible.builtin.debug:
    msg: >-
      Membership '{{ _membership }}' is READY at tier '{{ _observed_tier }}'
      ({{ 'newly registered by this run' if _register_result is not skipped
      else 'already registered, skipped (idempotent)' }}).
