[project]
name = "testing2-gcp-sre-agent"
version = "1.0.0"
description = "AI SRE incident-investigation agent on Vertex AI Agent Engine, governed by GCP Agent Gateway, with a two-project (agent + GKE) topology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# The deployed agent's runtime dependencies live in agent/requirements.txt
# (they are installed inside the Agent Engine runtime from the packaged
# agent.tar.gz). The lists below are for LOCAL development and evaluation only.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "black>=24.0.0",
  "pytest>=8.0.0",
]
eval = [
  "google-cloud-aiplatform[agent_engines,evaluation]>=1.60.0",
  "pandas>=2.0.0",
]
# issue #103 Slice 1: invoke_agent.py's async run_query_job()/check_query_job() path
# needs the vertexai._genai.agent_engines.AgentEngines SDK class, added in
# google-cloud-aiplatform 1.145.0 (2026-04-01) and backed by the AsyncQueryReasoningEngine
# v1 API GA'd in 1.149.0 (2026-04-27) -- confirmed via the SDK's own CHANGELOG.md.
# Floor is 1.150.0 (just past that GA) rather than 1.145.0 exactly, for margin. Upper bound
# excludes an unreviewed future major-version upgrade.
invoke = [
  "google-cloud-aiplatform[agent_engines]>=1.150.0,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# issue #77: ruff's own DEFAULT rule set is not stable across versions -- 0.16
# silently added I001 (import-sort) to it, which 0.15 did not have, producing
# 183 new findings in CI with zero code changes. An explicit select= makes the
# blocking CI gate's behavior a deliberate choice, not an accident of whichever
# ruff version happens to be installed. This is ruff's own pre-0.16 default
# rule set (E4/E7/E9 pycodestyle subset + F pyflakes) -- deliberately NOT
# adopting I001 (import-sort) here; that's a separate, unreviewed scope change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# presentation/build_deck.py is a slide-deck generator, not application or
# infrastructure code. It uses semicolon-joined statements throughout for compact
# layout calls -- 121 E702 findings, and no other rule anywhere in the repo. That
# style is deliberate there and ruff cannot autofix it. Without this ignore,
# "ruff check ." fails, which is what has been breaking the blocking CI gate since
# 2026-08-23. Scoped to the one file and the one rule: E702 still applies everywhere
# else, and every other rule still applies to this file.
[tool.ruff.lint.per-file-ignores]
"presentation/build_deck.py" = ["E702"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
