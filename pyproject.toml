[project]
name = "testing2-gcp-sre-agent"
version = "1.0.0"
description = "AI SRE incident-investigation agent on Vertex AI Agent Engine, governed by GCP Agent Gateway, with a two-project (agent + GKE) topology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# The deployed agent's runtime dependencies live in agent/requirements.txt
# (they are installed inside the Agent Engine runtime from the packaged
# agent.tar.gz). The lists below are for LOCAL development and evaluation only.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "black>=24.0.0",
  "pytest>=8.0.0",
]
eval = [
  "google-cloud-aiplatform[agent_engines,evaluation]>=1.60.0",
  "pandas>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# issue #77: ruff's own DEFAULT rule set is not stable across versions -- 0.16
# silently added I001 (import-sort) to it, which 0.15 did not have, producing
# 183 new findings in CI with zero code changes. An explicit select= makes the
# blocking CI gate's behavior a deliberate choice, not an accident of whichever
# ruff version happens to be installed. This is ruff's own pre-0.16 default
# rule set (E4/E7/E9 pycodestyle subset + F pyflakes) -- deliberately NOT
# adopting I001 (import-sort) here; that's a separate, unreviewed scope change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
