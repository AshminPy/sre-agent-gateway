name: python-tests

# Runs the pytest suite on PRs touching agent/** or tests/**. Added 2026-08-11
# (issue #63 PR 1 review) -- until this workflow existed, PRs to this repo had
# only a terraform plan check; a change that broke Python logic but produced
# a clean Terraform plan (exactly what happened with log_node_tokens() during
# this same review) had no CI signal to catch it. Deliberately lightweight:
# no GCP credentials, no Terraform -- the suite is credential-independent by
# design (adapter/SDK clients are constructed lazily, never at import time;
# verified locally with GCP env vars stripped entirely before adding this).

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "tests/**"
      - "mcp/**"
      - "scripts/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # agent/requirements.txt pins google-cloud-aiplatform[agent_engines]>=1.160.0,
          # which does not exist on PyPI (same finding terraform-apply.yml's smoke-test
          # step already works around -- real latest release is 1.148.1). Install
          # everything else from requirements.txt, then the corrected aiplatform pin.
          grep -v "google-cloud-aiplatform" agent/requirements.txt > /tmp/agent-requirements.txt
          pip install --quiet -r /tmp/agent-requirements.txt
          pip install --quiet "google-cloud-aiplatform[agent_engines]>=1.148.1"
          # ruff pinned exactly -- 0.16 silently changed ruff's own DEFAULT rule set
          # (added I001/import-sort) vs 0.15, which would make this blocking gate's
          # result depend on whichever version happened to be latest on a given day.
          # pyproject.toml's [tool.ruff.lint] select= is the other half of this fix
          # (an explicit, version-independent rule set); this pin is what makes ruff
          # itself deterministic. Not general dependency locking (that's #79) -- this
          # one pin exists specifically so the new blocking gate can't silently change
          # behavior on its own.
          pip install --quiet pytest "ruff==0.16.3" "black>=24.0.0" pip-audit

      - name: Run pytest
        run: python3 -m pytest tests/ -v

      # issue #77: blocking -- pyproject.toml already configures ruff (line-length 100,
      # py311); it was just never run anywhere. The 15 pre-existing violations this
      # would have caught were fixed in the same change that added this step.
      - name: Run ruff (blocking)
        run: ruff check .

      # issue #77: report-only, NOT blocking. black --check found 83 of 90 files would
      # reformat (confirmed formatting-only via diff -- no logic changes) -- too large a
      # change to bundle into this issue. Tracked as separate future cleanup, not gated
      # on here so it doesn't block unrelated PRs.
      - name: Run black --check (report-only)
        continue-on-error: true
        run: black --check .

      # issue #77: report-only, NOT blocking. CI baseline (this workflow's own run, the
      # authoritative source -- local venvs can differ slightly by preinstalled tooling
      # version): 10 known vulnerabilities across 5 packages (langchain-core, langgraph,
      # langgraph-checkpoint, langgraph-sdk, setuptools). Remediating them is issue #79's
      # scope (dependency pinning/locking), not this issue's.
      - name: Run pip-audit (report-only)
        continue-on-error: true
        run: python3 -m pip_audit --desc

  mcp-pytest:
    # issue #77: mcp/ is a separate deployable unit with its own requirements.txt
    # (see mcp/tests/conftest.py's own docstring) -- kept in its own job so its
    # dependencies never mix with the agent's install above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP dependencies
        run: |
          pip install --quiet -r mcp/requirements.txt
          pip install --quiet pytest pip-audit

      # test_live_connect_gateway.py auto-skips when its kubeconfig context isn't
      # present (pytest.mark.skipif checking `kubectl config get-contexts`) -- a clean
      # runner has no such context, so this runs the full suite unmodified. Confirmed
      # locally with KUBECONFIG=/dev/null: 57 passed, 7 skipped, 64 total.
      - name: Run MCP pytest
        run: |
          cd mcp
          python3 -m pytest tests/ -v

      # issue #77: mcp/ is a separate deployable unit with its own dependency set --
      # needs its own audit, not just agent/'s. Report-only, same as the agent job's
      # pip-audit step; remediating any findings is issue #79's scope, not this one's.
      - name: Run MCP pip-audit (report-only)
        continue-on-error: true
        run: python3 -m pip_audit --desc
