name: terraform-plan

# Plan the agent stack on pull requests. Uses Workload Identity Federation
# (no long-lived keys). The deployer identity is seeded once by
# scripts/bootstrap_wif.sh; these workflows pass create_wif=false so Terraform
# does not try to re-create it. Configure these repo secrets first:
#   GCP_WIF_PROVIDER  = output "wif_provider"      (printed by bootstrap_wif.sh)
#   GCP_DEPLOYER_SA   = output "deployer_sa_email"  (printed by bootstrap_wif.sh)
#   GCP_PROJECT_A_ID / GCP_PROJECT_B_ID / GCP_REGION
#   NOTIFICATION_EMAIL = email for Cloud Monitoring alerts
#   TFSTATE_BUCKET    = your Terraform state bucket

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "iac/agent/**"
      - "mcp/**"
      - "scripts/package_agent.sh"
      - "scripts/package_agent.py"
      - "scripts/build_mcp_tool_spec.py"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write        # required for WIF
  pull-requests: write   # to post the plan comment

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/agent
    steps:
      - uses: actions/checkout@v4

      # filebase64() reads agent.tar.gz at plan time, so build it first.
      - name: Package agent
        run: bash scripts/package_agent.sh
        working-directory: .

      # Same requirement for mcp/tool_spec.json, which agent_registry_mcp.tf reads
      # with file(). Without this the plan errors out on a missing file rather than
      # showing a diff. Regenerated here (not --check'd) so the plan reflects mcp/
      # at this commit, matching what terraform-apply.yml will register.
      - name: Build MCP tool spec
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' }}
        run: |
          pip install --quiet -r mcp/requirements.txt
          python3 scripts/build_mcp_tool_spec.py
        working-directory: .

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.4.7"

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" -backend-config="prefix=agent"

      # issue #116: without this, enable_custom_mcp/custom_mcp_image were never
      # passed to this plan, so it always used variables.tf's defaults
      # (enable_custom_mcp=false) instead of the live project's real state
      # (ENABLE_CUSTOM_MCP=true) -- every PR's plan check showed 4 custom-MCP
      # resources as phantom destroys that the real apply (which DOES pass
      # these two vars) never actually touches. Same read-only step as
      # terraform-apply.yml's "Read currently-deployed MCP image".
      - name: Read currently-deployed MCP image
        id: current_mcp_image
        run: |
          CURRENT=$(gcloud run services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || true)
          if [ -z "$CURRENT" ]; then
            CURRENT="us-docker.pkg.dev/cloudrun/container/placeholder"
          fi
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Validate
        run: terraform validate

      # Terraform-native tests (iac/agent/tests/*.tftest.hcl) — config/template
      # rendering only, no real cloud resources (the module under test has no
      # providers), so this needs no extra credentials beyond what's already
      # authenticated above. Catches regressions in clusters.json rendering
      # before they reach a real plan/apply.
      #
      # Section 10 (2026-09-08): confirmed live (real `terraform test` run against
      # the pinned CLI, terraform_version above) that this CLI version silently
      # reports "No tests defined" and exits 0 for EVERY run -- the 5 real
      # .tftest.hcl files use the `run { command = plan ... }` block syntax, which
      # requires Terraform >= 1.6; 1.4.7 predates it entirely and can't execute
      # them at all. This has looked like a passing green check on every PR the
      # whole time, testing nothing. Terraform 1.4.7 itself is a FIXED, deliberate
      # company/Spacelift compatibility pin (see iac/agent/versions.tf) -- not
      # something this change proposes bumping. Per this section's own guidance
      # ("report no-tests as no-tests" -- don't silently accept a misleading
      # green check, but also don't turn an already-known, policy-locked
      # limitation into a new hard CI block with no available fix): this step now
      # makes that fact LOUD and visible (a GitHub Actions warning annotation)
      # instead of a clean-looking, silent no-op. Replacing it with real coverage
      # requires either an authorized Terraform CLI version change for this repo
      # (a decision for whoever owns that policy) or rewriting these 5 test files
      # as CLI-1.4.7-compatible checks (e.g. `terraform show -json` + a plain
      # script asserting on rendered output) -- real, separate follow-up work,
      # not done here.
      - name: Terraform test
        run: |
          OUTPUT=$(terraform test 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "No tests defined"; then
            echo "::warning::terraform test executed ZERO of the 5 real test suites in iac/agent/tests/*.tftest.hcl -- Terraform 1.4.7 (this repo's fixed CLI pin) cannot run the modern run-block test syntax they use (needs >=1.6). This is NOT a passing test result; it is a known, disclosed gap. See PHASE1_EVIDENCE_LOG.md's Section 10 entry."
          fi

      # gemini_model is pinned here explicitly because iac/agent/terraform.tfvars
      # (the file holding the real production value) is gitignored and never
      # reaches CI's checkout. Without this, CI silently falls back to
      # variables.tf's default (gemini-2.5-flash), which differs from the live
      # engine's gemini-2.5-pro — producing a false "1 to change" plan diff that,
      # if applied, downgrades the model AND wipes agentGatewayConfig (Terraform
      # apply on this resource clears any out-of-band field it doesn't manage,
      # see archive/RESOLVED_2026-07-17_TROUBLESHOOTING_LOG.md). Keep this in sync with terraform.tfvars.
      #
      # onprem_fleet_membership/custom_mcp_kube_context added 2026-09-05 (real
      # regression found and fixed the same day): this plan previously omitted
      # both, so every PR's plan showed a phantom destroy of the Connect
      # Gateway IAM binding and Cloud Run env var that the real apply (see
      # terraform-apply.yml) actually keeps — plan and apply must use the same
      # variable set, or plan is misleading. Both are plain repo Variables
      # (Settings > Variables), not secrets — neither value is sensitive; the
      # actual Google IAM authorization is the real control, not these strings.
      - name: Plan
        run: |
          terraform plan -no-color \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false" \
            -var="gemini_model=gemini-2.5-pro" \
            -var="enable_custom_mcp=${{ vars.ENABLE_CUSTOM_MCP || 'false' }}" \
            -var="custom_mcp_image=${{ steps.current_mcp_image.outputs.image }}" \
            -var="onprem_fleet_membership=${{ vars.ONPREM_FLEET_MEMBERSHIP || '' }}" \
            -var="custom_mcp_kube_context=${{ vars.CUSTOM_MCP_KUBE_CONTEXT || '' }}"
