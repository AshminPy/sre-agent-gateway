name: terraform-plan

# Plan the agent stack on pull requests. Uses Workload Identity Federation
# (no long-lived keys). The deployer identity is seeded once by
# scripts/bootstrap_wif.sh; these workflows pass create_wif=false so Terraform
# does not try to re-create it. Configure these repo secrets first:
#   GCP_WIF_PROVIDER  = output "wif_provider"      (printed by bootstrap_wif.sh)
#   GCP_DEPLOYER_SA   = output "deployer_sa_email"  (printed by bootstrap_wif.sh)
#   GCP_PROJECT_A_ID / GCP_PROJECT_B_ID / GCP_REGION
#   NOTIFICATION_EMAIL = email for Cloud Monitoring alerts
#   TFSTATE_BUCKET    = your Terraform state bucket

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "iac/agent/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write        # required for WIF
  pull-requests: write   # to post the plan comment

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/agent
    steps:
      - uses: actions/checkout@v4

      # filebase64() reads agent.tar.gz at plan time, so build it first.
      - name: Package agent
        run: bash scripts/package_agent.sh
        working-directory: .

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" -backend-config="prefix=agent"

      # issue #116: without this, enable_custom_mcp/custom_mcp_image were never
      # passed to this plan, so it always used variables.tf's defaults
      # (enable_custom_mcp=false) instead of the live project's real state
      # (ENABLE_CUSTOM_MCP=true) -- every PR's plan check showed 4 custom-MCP
      # resources as phantom destroys that the real apply (which DOES pass
      # these two vars) never actually touches. Same read-only step as
      # terraform-apply.yml's "Read currently-deployed MCP image".
      - name: Read currently-deployed MCP image
        id: current_mcp_image
        run: |
          CURRENT=$(gcloud run services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || true)
          if [ -z "$CURRENT" ]; then
            CURRENT="us-docker.pkg.dev/cloudrun/container/placeholder"
          fi
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Validate
        run: terraform validate

      # Terraform-native tests (iac/agent/tests/*.tftest.hcl) — config/template
      # rendering only, no real cloud resources (the module under test has no
      # providers), so this needs no extra credentials beyond what's already
      # authenticated above. Catches regressions in clusters.json rendering
      # before they reach a real plan/apply.
      - name: Terraform test
        run: terraform test

      # gemini_model is pinned here explicitly because iac/agent/terraform.tfvars
      # (the file holding the real production value) is gitignored and never
      # reaches CI's checkout. Without this, CI silently falls back to
      # variables.tf's default (gemini-2.5-flash), which differs from the live
      # engine's gemini-2.5-pro — producing a false "1 to change" plan diff that,
      # if applied, downgrades the model AND wipes agentGatewayConfig (Terraform
      # apply on this resource clears any out-of-band field it doesn't manage,
      # see archive/RESOLVED_2026-07-17_TROUBLESHOOTING_LOG.md). Keep this in sync with terraform.tfvars.
      - name: Plan
        run: |
          terraform plan -no-color \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false" \
            -var="gemini_model=gemini-2.5-pro" \
            -var="enable_custom_mcp=${{ vars.ENABLE_CUSTOM_MCP || 'false' }}" \
            -var="custom_mcp_image=${{ steps.current_mcp_image.outputs.image }}"
