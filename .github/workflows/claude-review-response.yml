name: Claude PR Review Response

# Phase 1 of the ChatGPT <-> Claude review loop (see PR that introduced this file
# for design notes). Wakes Claude Code on an explicit @claude mention in a PR
# comment or review, has it independently re-verify the finding against the
# CURRENT code before changing anything, and push a fix if one is warranted.
#
# Deliberately out of scope for this phase: auto-merge, post-merge deploy
# monitoring, tracker updates. Those are separate, later workflows requiring
# their own review.
#
# Safety notes:
# - No GCP/Terraform credentials are configured in this job (no
#   google-github-actions/auth step) -- unlike terraform-plan.yml /
#   terraform-apply.yml, this workflow has no path to live infrastructure
#   even if instructed to reach for one.
# - This filename does not match terraform-apply.yml's
#   ".github/workflows/terraform-*.yml" path filter, so merging/editing this
#   file does not trigger a deploy.
# - terraform-apply.yml only triggers on push to `main`; this workflow only
#   ever pushes to the PR's own branch, so it cannot reach the deploy trigger.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-respond:
    # Only fires on an explicit @claude mention, on a PR (not a bare issue).
    # Who is allowed to trigger this is enforced by anthropics/claude-code-action
    # itself: by default only commenters with write access to the repo can
    # trigger it, and bot actors are rejected unless explicitly allow-listed
    # (we do not allow-list any bot here). AshminPy has admin access, so
    # AshminPy-authored @claude comments -- including ChatGPT's, which posts
    # under that same account -- already pass this check with no extra config.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI check results on the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve current PR head SHA
        id: pr_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A comment or review mentioning @claude was left on PR #${{ steps.pr_state.outputs.pr_number }}
            in ${{ github.repository }}. The likely author is ChatGPT, posting its independent
            review under the AshminPy account.

            The VERIFIED current PR head SHA is ${{ steps.pr_state.outputs.sha }} -- fetched fresh
            via `gh pr view` at the start of this run, not taken from the comment or event payload.
            Validate everything against this exact SHA. If the review comment appears to reference
            an older/different SHA, say so explicitly in your reply instead of assuming it still
            applies.

            Do the following, in order:
            1. Fetch the PR diff and the actual text of the triggering comment/review -- do not
               act on a paraphrase or assumption of what it says.
            2. Independently validate every material finding in the comment against the CURRENT
               PR diff, current `main`, the linked GitHub issue (if any), existing tests, and the
               real code/architecture. Do not take the comment's claims on faith -- read the
               actual files and, where relevant, run the actual tests.
            3. For any finding that is wrong, outdated, or unsupported by the code: do NOT change
               working code to satisfy it. Post one concise PR comment explaining why, citing the
               specific file/line evidence that contradicts it.
            4. For any finding that is correct: implement the smallest safe fix, run the relevant
               tests (check the Makefile and this repo's CI workflow files for the real test
               commands -- never invent one), and only push once they pass.
            5. If you push a fix, leave one concise evidence comment on the PR: what was actually
               wrong, exactly what changed, and which tests were run and passed. Do not
               re-mention @claude or the reviewer in your own comment -- the hourly reviewer
               will pick up the new commit on its own next pass.
            6. If a finding cannot be confirmed or refuted from available evidence, say so
               explicitly in your reply instead of guessing either way.

            Hard boundaries for this run -- do not treat these as optional:
            - Do not merge this PR. Merge automation does not exist yet.
            - Do not run `terraform apply`, `terraform destroy`, `gcloud`, or `kubectl` -- this
              job has no cloud credentials configured, and this phase of the automation must
              never touch live infrastructure.
            - Only push commits to this PR's own branch. Never push to `main`.
          claude_args: |
            --disallowedTools "Bash(terraform apply:*),Bash(terraform destroy:*)"
