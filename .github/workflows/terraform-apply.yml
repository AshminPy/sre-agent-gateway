name: terraform-apply

# Apply the agent stack on push to main. Requires the same secrets as
# terraform-plan.yml. The `production` environment gives you a manual approval
# gate (configure it in the repo settings).

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "iac/agent/**"
      - ".github/workflows/terraform-*.yml"

# Never run two applies at once against the same state.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: iac/agent
    steps:
      - uses: actions/checkout@v4

      - name: Package agent
        run: bash scripts/package_agent.sh
        working-directory: .

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" -backend-config="prefix=agent"

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false"

      # Post-apply: register Agent Registry endpoints, then bind the gateway
      # (both no-ops when the gateway is disabled). Order matters for a
      # clean first-time apply: attach_gateway_to_engine.sh's own pre-flight
      # checks report registration status, so registering first avoids a
      # false warning on the very first CI run.
      - name: Register Agent Registry endpoints
        run: |
          python3 scripts/register_endpoints.py \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --mtls-endpoints=include
        working-directory: .

      - name: Attach gateway to engine
        run: bash scripts/attach_gateway_to_engine.sh
        working-directory: .
