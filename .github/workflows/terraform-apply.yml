name: terraform-apply

# Apply the agent stack on push to main. Requires the same secrets as
# terraform-plan.yml. The `production` environment gives you a manual approval
# gate (configure it in the repo settings).

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "mcp/**"
      - "iac/agent/**"
      - "scripts/package_agent.sh"
      - "scripts/package_agent.py"
      - "scripts/build_mcp_tool_spec.py"
      - "scripts/smoke_test.sh"
      - ".github/workflows/terraform-*.yml"

# Never run two applies at once against the same state.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: iac/agent
    steps:
      - uses: actions/checkout@v4

      # Detects whether THIS push actually touched mcp/ — gates the MCP image
      # build/Cloud Run update below so an agent-only or Terraform-only change
      # doesn't pay for a Docker build+push it doesn't need. Pinned to a full
      # commit SHA (not a floating @v4 tag) per this repo's convention for
      # third-party actions with write-adjacent side effects.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mcp:
              - 'mcp/**'

      - name: Package agent
        run: bash scripts/package_agent.sh
        working-directory: .

      # mcp/tool_spec.json is read by iac/agent/agent_registry_mcp.tf via file(), so
      # it must exist before plan/apply — same ordering requirement as agent.tar.gz
      # above. It is deliberately NOT regenerated from this commit's mcp/ code here:
      # this pins it to whatever is CURRENTLY LIVE instead, so the two applies below
      # cannot change the registry's tool-spec content before the new Cloud Run
      # revision (built/deployed further down) has passed "Verify MCP Cloud Run
      # revision is healthy". Without this, a broken mcp/ change could leave the
      # registry already describing NEW tools while Cloud Run serves the OLD (or a
      # crashed) revision — the registry and the running server would disagree,
      # a real runtime/evidence-integrity risk, not a cosmetic one. The real
      # regeneration happens in "Regenerate MCP tool spec now that the new revision
      # is verified healthy", below the health check.
      #
      # Falls back to a fresh build when the service doesn't exist live yet
      # (first-ever enable) — Terraform will CREATE it in that case, not update a
      # live one, so there is no existing revision to protect.
      - name: Pin MCP tool spec to currently-live content
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' }}
        run: |
          pip install --quiet -r mcp/requirements.txt
          LIVE_JSON=$(gcloud alpha agent-registry services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --location="${{ secrets.GCP_REGION }}" \
            --format=json 2>/dev/null || echo "")
          if [ -n "$LIVE_JSON" ]; then
            echo "$LIVE_JSON" | python3 -c "import json, sys; live = json.load(sys.stdin); content = live['mcpServerSpec']['content']; open('mcp/tool_spec.json', 'w').write(json.dumps(content, separators=(',', ':'), sort_keys=True))"
            echo "Pinned mcp/tool_spec.json to the currently-live registration."
          else
            echo "No live sre-k8s-mcp registration found — generating fresh (first-ever enable)."
            python3 scripts/build_mcp_tool_spec.py
          fi
        working-directory: .

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.4.7"

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" -backend-config="prefix=agent"

      # Reads the currently-deployed custom MCP Cloud Run image BEFORE the
      # first apply below. Real regression found and fixed 2026-08-11 while
      # adding the mcp/ path-filter gate on the build step further down:
      # Terraform CLI vars are not sticky across separate `apply` invocations
      # — the first apply's -var list never included custom_mcp_image, so
      # omitting it always meant "use variables.tf's placeholder default" for
      # THAT plan, regardless of what's actually running. Confirmed live via
      # `terraform plan` against real deployed state before this fix: without
      # this step, a push that skips the build below (agent-only or
      # Terraform-only change) would have had this apply silently downgrade
      # the live custom MCP service back to the Google placeholder image.
      # Empty/failed describe (service doesn't exist yet, or the feature is
      # off) falls back to the same placeholder the variable's own default
      # already uses — identical behavior to before this fix in that case.
      - name: Read currently-deployed MCP image
        id: current_mcp_image
        run: |
          CURRENT=$(gcloud run services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || true)
          if [ -z "$CURRENT" ]; then
            CURRENT="us-docker.pkg.dev/cloudrun/container/placeholder"
          fi
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
        working-directory: .

      # gemini_model is pinned here explicitly because iac/agent/terraform.tfvars
      # (the file holding the real production value) is gitignored and never
      # reaches CI's checkout. Without this, CI silently falls back to
      # variables.tf's default (gemini-2.5-flash), which differs from the live
      # engine's gemini-2.5-pro — producing a false "1 to change" plan diff that,
      # if applied, downgrades the model AND wipes agentGatewayConfig (Terraform
      # apply on this resource clears any out-of-band field it doesn't manage,
      # see archive/RESOLVED_2026-07-17_TROUBLESHOOTING_LOG.md). Keep this in sync with terraform.tfvars.
      #
      # enable_custom_mcp defaults to the ENABLE_CUSTOM_MCP repo variable (unset
      # = "false") so this workflow file alone never silently turns the feature
      # (and its real Cloud Run/Artifact Registry/IAM resources) on — that's a
      # deliberate opt-in, set in repo Settings > Variables, not a code change.
      #
      # This first apply runs BEFORE the image build below on purpose: on the
      # very first enable, the Artifact Registry repo (google_artifact_registry_
      # repository.mcp) doesn't exist yet for the build step to push into.
      # Terraform can't build/push a container image itself, so this apply just
      # ensures the repo + Cloud Run service exist (on the placeholder image if
      # custom_mcp_image was never set before) — the second apply below then
      # points Cloud Run at the real image once it's been pushed.
      - name: Apply (ensure infra + Artifact Registry repo exist)
        run: |
          terraform apply -auto-approve \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false" \
            -var="gemini_model=gemini-2.5-pro" \
            -var="enable_custom_mcp=${{ vars.ENABLE_CUSTOM_MCP || 'false' }}" \
            -var="custom_mcp_image=${{ steps.current_mcp_image.outputs.image }}"

      # Build & push the custom MCP image only when the feature is enabled AND
      # this push actually touched mcp/ (real path-filter check via the
      # "Detect changed paths" step above — 2026-08-11: this comment used to
      # claim that condition without it actually being implemented; the
      # `if:` below only checked the feature flag, so every agent-only or
      # Terraform-only push still rebuilt/pushed a fresh image every time).
      - name: Build & push MCP image
        id: mcp_image
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' && steps.filter.outputs.mcp == 'true' }}
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_A_ID }}/sre-agent-repo/sre-k8s-mcp:${{ github.sha }}"
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" mcp/
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        working-directory: .

      # Second apply: only needed when the feature is on AND mcp/ actually
      # changed (same gate as the build step above — nothing to point Cloud
      # Run at if no new image was built this run). custom_mcp_image is the
      # only var that can actually differ from the first apply — everything
      # else is identical, so this plans/applies as a single targeted update,
      # not a full re-apply.
      - name: Apply (point Cloud Run at the new MCP image)
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' && steps.filter.outputs.mcp == 'true' }}
        run: |
          terraform apply -auto-approve \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false" \
            -var="gemini_model=gemini-2.5-pro" \
            -var="enable_custom_mcp=true" \
            -var="custom_mcp_image=${{ steps.mcp_image.outputs.image }}"

      # Real deploy-verification, not just "apply succeeded": the Cloud Run
      # service uses INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER, so a plain HTTP
      # curl from this external GitHub-hosted runner cannot reach it (verified
      # against the resource's own ingress setting in iac/agent/cloudrun_mcp.tf
      # before writing this step, rather than assuming an HTTP check would
      # work). Instead, confirm the revision Terraform just pointed at the new
      # image is actually Ready and serving — catches an image that fails to
      # start (bad ENTRYPOINT, crash on boot, etc.) that `apply` alone wouldn't.
      - name: Verify MCP Cloud Run revision is healthy
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' }}
        run: |
          gcloud run services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format="value(status.conditions[0].type,status.conditions[0].status,status.latestReadyRevision)"
          READY=$(gcloud run services describe sre-k8s-mcp \
            --project="${{ secrets.GCP_PROJECT_A_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format="value(status.conditions[0].status)")
          if [ "$READY" != "True" ]; then
            echo "MCP Cloud Run revision is NOT Ready — see conditions above." >&2
            exit 1
          fi

      # Only reached once the health check above has passed. This is the one place
      # mcp/tool_spec.json is allowed to change to match this commit's real mcp/
      # code — see "Pin MCP tool spec to currently-live content" earlier in this job
      # for why it was withheld until now.
      - name: Regenerate MCP tool spec now that the new revision is verified healthy
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' }}
        run: python3 scripts/build_mcp_tool_spec.py
        working-directory: .

      # Agent Registry registration is Terraform-managed as of 2026-09-04 (issue #33).
      # The two imperative steps that used to live here — scripts/register_endpoints.py
      # (Google APIs) and scripts/register_custom_mcp.py (the custom Cloud Run MCP) —
      # are retired to archive/. Every registration reconciles from
      # iac/agent/agent_registry{,_mcp}.tf on every apply now, so a hand-edited or
      # deleted registration is corrected instead of silently persisting (the old
      # scripts skipped any service ID that already existed, so they could never fix
      # a wrong URL on an existing entry — the landmine that let issue #30's Model
      # Armor .rep. hostname survive a "fix").
      #
      # This third apply is deliberately plain — no -target. Cloud Run, IAM, and the
      # static Agent Registry entries already converged in the two applies above, so
      # the only resource with a pending diff here is google_agent_registry_service.
      # custom_mcp, and only because the tool spec was just regenerated. If mcp/
      # didn't change this push, the regenerated content already matches what was
      # pinned above and this apply is a genuine no-op for that resource too.
      - name: Apply (register verified custom MCP tool spec)
        if: ${{ vars.ENABLE_CUSTOM_MCP == 'true' }}
        run: |
          terraform apply -auto-approve \
            -var="project_a_id=${{ secrets.GCP_PROJECT_A_ID }}" \
            -var="project_b_id=${{ secrets.GCP_PROJECT_B_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="create_wif=false" \
            -var="gemini_model=gemini-2.5-pro" \
            -var="enable_custom_mcp=true" \
            -var="custom_mcp_image=${{ steps.mcp_image.outputs.image || steps.current_mcp_image.outputs.image }}"

      # 2026-08-10: scripts/attach_gateway_to_engine.sh is no longer run
      # automatically here. The gateway binding (`agentGatewayConfig`) is now
      # part of the google_vertex_ai_reasoning_engine.sre_agent Terraform
      # resource itself (iac/agent/agent_engine.tf, google-beta >= 7.40.0) —
      # the "Apply (ensure infra + Artifact Registry repo exist)" step above
      # already applies it as an ordinary in-place update, same as any other
      # config change. Verified live before this cutover: a fresh binding
      # (Test A) and a source-only update with the binding unchanged (Test B)
      # both preserved agentGatewayConfig, Agent Identity, and the Reasoning
      # Engine/Gateway IDs, with zero replacement in either case.
      #
      # attach_gateway_to_engine.sh itself is UNCHANGED and stays in the repo
      # as a manual emergency rollback tool — see its own header. It is not
      # invoked by this workflow anymore; run it by hand only if a real
      # deployment needs to fall back to the old out-of-band PATCH path.

      # Real end-to-end proof, not just "the apply succeeded": invokes
      # the deployed agent on a live fixture (k8s/imagepull-pod.yaml, a
      # standing ImagePullBackOff pod in the Project B test cluster) and
      # fails the job if it doesn't get back a well-formed RCA. The gateway
      # bind operation can report done=true while the runtime connection is
      # still broken (this is exactly how the original mTLS failure hid —
      # see archive/RESOLVED_2026-07-17_TROUBLESHOOTING_LOG.md) — this step is what would have caught it
      # in CI instead of requiring manual investigation.
      #
      # google-cloud-aiplatform pin fixed 2026-08-07: >=1.160.0 does not
      # exist on PyPI (confirmed live — `pip install` fails outright with
      # "No matching distribution found", latest real release is 1.148.1).
      # On a fresh CI runner (no pre-installed package) this would have
      # failed before smoke_test.sh even ran; only worked in local testing
      # because a compatible version happened to already be installed from
      # earlier work in that environment.
      - name: Smoke test — verify the agent responds through the gateway
        run: |
          pip install --quiet "google-cloud-aiplatform[agent_engines]>=1.148.1"
          bash scripts/smoke_test.sh
        working-directory: .
