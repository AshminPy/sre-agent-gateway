apiVersion: v1
kind: Pod
metadata:
  name: wrongport-pod
  namespace: test-incidents
  labels:
    incident-type: WrongTargetPort
    app: wrongport-pod
spec:
  restartPolicy: Always
  containers:
    - name: server
      image: python:3.11-slim
      command: ["python", "-m", "http.server", "8080"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "100m"
        limits:
          memory: "64Mi"
          cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: wrongport-svc
  namespace: test-incidents
  labels:
    incident-type: WrongTargetPort
spec:
  selector:
    app: wrongport-pod
  ports:
    - port: 80
      targetPort: 9999
