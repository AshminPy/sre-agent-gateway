apiVersion: v1
kind: Pod
metadata:
  name: impossible-resources-pod
  namespace: test-incidents
  labels:
    incident-type: Unschedulable
    app: impossible-resources-pod
spec:
  restartPolicy: Never
  containers:
    - name: hungry
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "999Gi"
          cpu: "64"
        limits:
          memory: "999Gi"
          cpu: "64"
