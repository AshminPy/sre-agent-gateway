apiVersion: v1
kind: Pod
metadata:
  name: nodeselector-pod
  namespace: test-incidents
  labels:
    incident-type: NodeSelectorMismatch
    app: nodeselector-pod
spec:
  restartPolicy: Never
  nodeSelector:
    disktype: nonexistent-ssd-tier
  containers:
    - name: waiter
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "50m"
        limits:
          memory: "32Mi"
          cpu: "100m"
