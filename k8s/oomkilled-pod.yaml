apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-pod
  namespace: test-incidents
  labels:
    incident-type: OOMKilled
    app: oomkilled-pod
spec:
  restartPolicy: Always
  containers:
    - name: memory-hog
      image: python:3.11-slim
      command: ["python", "-c"]
      args:
        - |
          import time
          print("Allocating memory until OOMKilled...")
          data = []
          while True:
              data.append("x" * 10_000_000)  # 10MB per iteration
              time.sleep(0.1)
      resources:
        requests:
          memory: "30Mi"
          cpu: "100m"
        limits:
          memory: "50Mi" # Hard limit — will OOMKill
          cpu: "200m"
