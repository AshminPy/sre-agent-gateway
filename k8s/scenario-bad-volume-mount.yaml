apiVersion: v1
kind: Pod
metadata:
  name: badvolume-pod
  namespace: test-incidents
  labels:
    incident-type: BadVolumeMount
    app: badvolume-pod
spec:
  restartPolicy: Never
  containers:
    - name: mounter
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: missing-config
          mountPath: /etc/config
      resources:
        requests:
          memory: "16Mi"
          cpu: "50m"
        limits:
          memory: "32Mi"
          cpu: "100m"
  volumes:
    - name: missing-config
      configMap:
        name: nonexistent-configmap-for-volume-mount-test
