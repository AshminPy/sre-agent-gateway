# SCENARIO: Bad / missing Secret — pod stuck in ContainerCreating
#
# Symptom: user-service has been ContainerCreating for 10+ minutes.
#          Authentication is broken for all users.
#
# Root cause: pod references Secret "db-credentials" which was never created.
#             Common cause: secret was rotated/deleted and new one not applied.
#
# Agent must find:
#   1. kubectl describe pod: "MountVolume.SetUp failed: secret not found"
#   2. kubectl get secret db-credentials -n demo-incidents → NotFound
#   3. Pod events: Warning FailedMount
#   4. Fix: create the secret with correct values
#
apiVersion: v1
kind: Pod
metadata:
  name: user-service
  namespace: demo-incidents
  labels:
    incident-type: MissingSecret
    app: user-service
  annotations:
    incident-description: "pod stuck ContainerCreating — Secret 'db-credentials' not found"
spec:
  restartPolicy: Never
  containers:
    - name: user-service
      image: python:3.11-slim
      command: ["python", "-c"]
      args:
        - |
          import os
          import http.server
          import socketserver

          db_password = os.environ.get("DB_PASSWORD", "")
          jwt_secret  = os.environ.get("JWT_SECRET", "")
          print(f"user-service starting (db_password set={bool(db_password)})")

          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{"status": "ok"}')
              def log_message(self, fmt, *args): pass

          with socketserver.TCPServer(("", 8080), Handler) as httpd:
              httpd.serve_forever()
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials     # SECRET DOES NOT EXIST
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: db-credentials     # SECRET DOES NOT EXIST
              key: jwt-secret
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
