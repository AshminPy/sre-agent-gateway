# SCENARIO: 3-tier cascading failure (FLAGSHIP demo)
#
# Symptom: "The entire website is down. Users are getting 500 errors."
#
# Architecture:
#   web-frontend → api-service:8080 → postgres-db:5432
#
# What's failing:
#   postgres-db  → OOMKilled (memory limit 32Mi, tries to use 80Mi)
#   api-service  → CrashLoopBackOff (can't connect to postgres-db)
#   web-frontend → CrashLoopBackOff (can't connect to api-service)
#
# Common mistake: blame the frontend (first thing users see).
# Real root cause: postgres-db needs more memory → everything recovers.
#
# Agent must find:
#   1. web-frontend logs: "FATAL: cannot reach api-service:8080"
#   2. api-service logs: "FATAL: cannot connect to postgres-db:5432"
#   3. postgres-db pod: OOMKilled, restartCount high
#   4. postgres-db lastState.reason = OOMKilled
#   5. Root cause: postgres-db memory limit 32Mi is too low
#   6. Fix: increase postgres-db memory limit to 256Mi minimum
#
---
# LAYER 1: Database (root cause — OOMKilled)
apiVersion: v1
kind: Pod
metadata:
  name: postgres-db
  namespace: demo-incidents
  labels:
    incident-type: CascadingFailure3Tier
    app: postgres-db
    tier: database
  annotations:
    incident-description: "OOMKilled — root cause of entire stack failure"
spec:
  restartPolicy: Always
  containers:
    - name: postgres-db
      image: python:3.11-slim
      command: ["python", "-c"]
      args:
        - |
          import time
          import sys

          print("postgres-db: starting, loading indexes into memory...", flush=True)
          data = []
          chunk = 1024 * 1024  # 1MB chunks

          for i in range(100):
              data.append(b"x" * chunk)
              if i % 5 == 0:
                  print(f"postgres-db: index loaded {i+1}MB", flush=True)
              time.sleep(0.1)

          print("postgres-db: ready", flush=True)
          while True:
              time.sleep(1)
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "32Mi"     # Too low — OOMKilled around 32MB
          cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: demo-incidents
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
---
# LAYER 2: API Service (fails because DB is down)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: demo-incidents
  labels:
    incident-type: CascadingFailure3Tier
  annotations:
    incident-description: "CrashLoopBackOff — cannot connect to postgres-db (OOMKilled)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        tier: api
    spec:
      containers:
        - name: api-service
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import socket
              import sys
              import time

              print("api-service: starting, connecting to database...", flush=True)
              time.sleep(2)

              try:
                  sock = socket.create_connection(("postgres-db", 5432), timeout=3)
                  sock.close()
                  print("api-service: database connection OK", flush=True)
              except Exception as e:
                  print(
                      f"FATAL: cannot connect to postgres-db:5432 — {e}",
                      file=sys.stderr, flush=True
                  )
                  print(
                      "api-service cannot start without database. Check postgres-db pod status.",
                      file=sys.stderr
                  )
                  sys.exit(1)
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: demo-incidents
spec:
  selector:
    app: api-service
  ports:
    - port: 8080
      targetPort: 8080
---
# LAYER 3: Web Frontend (fails because API is down)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo-incidents
  labels:
    incident-type: CascadingFailure3Tier
  annotations:
    incident-description: "CrashLoopBackOff — cannot reach api-service (downstream cascade)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        tier: frontend
    spec:
      containers:
        - name: web-frontend
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import socket
              import sys
              import time

              print("web-frontend: starting, checking API availability...", flush=True)
              time.sleep(3)

              try:
                  sock = socket.create_connection(("api-service", 8080), timeout=3)
                  sock.close()
                  print("web-frontend: API is available", flush=True)
              except Exception as e:
                  print(
                      f"FATAL: cannot reach api-service:8080 — {e}",
                      file=sys.stderr, flush=True
                  )
                  print(
                      "FATAL: web-frontend cannot serve users without API. HTTP 503.",
                      file=sys.stderr
                  )
                  sys.exit(1)
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo-incidents
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 8080
