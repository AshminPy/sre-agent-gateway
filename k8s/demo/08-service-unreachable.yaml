# SCENARIO: Service unreachable — deployment scaled to 0
#
# Symptom: search-service returns "connection refused" for all clients.
#          DevOps team says "the service exists and was working yesterday."
#
# Root cause: someone ran `kubectl scale deployment search-service --replicas=0`
#             (maybe for maintenance, maybe by mistake).
#             The Service object still exists, but there are zero pods behind it.
#             All TCP connections are immediately refused.
#
# Agent must find:
#   1. kubectl get service search-service: service exists, selector correct
#   2. kubectl get endpoints search-service: <none>
#   3. kubectl get deployment search-service: READY=0/0, AVAILABLE=0
#   4. kubectl describe deployment: replicas=0 (scaled down)
#   5. Fix: kubectl scale deployment search-service --replicas=2
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: demo-incidents
  labels:
    incident-type: ServiceUnreachable
    app: search-service
  annotations:
    incident-description: "deployment scaled to 0 — service exists but zero pods, all requests refused"
spec:
  replicas: 0            # INTENTIONALLY ZERO — this is the bug
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import http.server
              import socketserver

              class Handler(http.server.SimpleHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'{"status": "ok", "results": []}')
                  def log_message(self, fmt, *args): pass

              print("search-service starting on :8080")
              with socketserver.TCPServer(("", 8080), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: demo-incidents
  annotations:
    incident-description: "service exists but no endpoints because deployment is scaled to 0"
spec:
  selector:
    app: search-service
  ports:
    - port: 80
      targetPort: 8080
