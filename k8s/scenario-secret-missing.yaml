# SCENARIO: Missing Secret — pod stuck in ContainerCreating
#
# What's happening:
#   Pod mounts a Secret named "db-credentials" that was never created.
#   Pod stays in ContainerCreating indefinitely.
#   Events show: "MountVolume.SetUp failed ... secret not found"
#
# What agent must find:
#   1. Pod status: ContainerCreating (not Running)
#   2. Events: secret "db-credentials" not found
#   3. Root cause: deployment refers to a Secret that was deleted or never applied
#
# Fixes agent/eval/golden_cases.py's secret-001: no manifest previously existed for this
# case, so its target namespace (demo-incidents) contained an unrelated, already-broken
# "user-service" Deployment left over from prior, unrelated testing -- the agent correctly
# investigated what it found (that Deployment), but it wasn't the intended scenario. See
# docs/management/confidence-genericity-review-2026-08-28.md #15.7/§6 ("test-fixture
# contamination", not a scoring bug). This creates a Pod with the EXACT name/namespace
# golden_cases.py's secret-001 expects (resource_hints: namespace=demo-incidents,
# pod=user-service) so a name-scoped tool call finds this Pod, not the unrelated Deployment's
# differently-named (hash-suffixed) pods. The stale Deployment is deliberately left in place,
# not deleted -- untouched, unrelated cluster state, out of scope for this fix.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-incidents
  labels:
    environment: phase0-validation
    managed-by: sre-agent
---
apiVersion: v1
kind: Pod
metadata:
  name: user-service
  namespace: demo-incidents
  labels:
    incident-type: MissingSecret
    app: user-service
  annotations:
    incident-description: "pod stuck in ContainerCreating -- secret db-credentials not found"
spec:
  restartPolicy: Never
  containers:
    - name: user-service
      image: python:3.11-slim
      command: ["python", "-c"]
      args:
        - |
          import http.server
          import socketserver

          db_user = open("/secrets/DB_USER").read().strip()
          db_pass = open("/secrets/DB_PASSWORD").read().strip()
          print(f"user-service starting -- DB_USER={db_user}")

          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{"status": "ok"}')
              def log_message(self, format, *args):
                  pass

          with socketserver.TCPServer(("", 8080), Handler) as httpd:
              httpd.serve_forever()
      volumeMounts:
        - name: secret-volume
          mountPath: /secrets
          readOnly: true
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials      # THIS Secret does not exist
